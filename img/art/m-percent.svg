<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 195" role="img" aria-label="Bar diagram of a change from 60 to 72, a 20 percent increase" font-family="Lexend,Segoe UI,Arial,sans-serif"><rect width="620" height="195" fill="#fff"/><text x="20" y="32" font-size="17" fill="#0f1b2d">% change = (new − original) ÷ <tspan font-weight="700" fill="#1456c0">original</tspan> × 100</text><rect x="20" y="52" width="360" height="40" fill="#cfe0fb" stroke="#1456c0"/><text x="200" y="78" font-size="16" text-anchor="middle" fill="#0f1b2d">original 60</text><rect x="20" y="104" width="360" height="40" fill="#cfe0fb" stroke="#1456c0"/><rect x="380" y="104" width="72" height="40" fill="#0a84ff"/><text x="200" y="130" font-size="16" text-anchor="middle" fill="#0f1b2d">new 72</text><text x="416" y="130" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">+12</text><text x="20" y="178" font-size="17" fill="#0f1b2d">12 ÷ 60 × 100 = <tspan font-weight="700" fill="#1456c0">+20%</tspan>   <tspan fill="#5b6b80" font-size="14">(not 12 ÷ 72)</tspan></text></svg>