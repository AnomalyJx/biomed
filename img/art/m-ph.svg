<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 205" role="img" aria-label="pH scale from 0 to 14 with hydrogen ion concentrations as powers of ten" font-family="Lexend,Segoe UI,Arial,sans-serif"><rect width="670" height="205" fill="#fff"/><text x="20" y="30" font-size="17" fill="#0f1b2d">Each step is ×10:  pH ≈ −log₁₀[H⁺]</text><rect x="20" y="45" width="42" height="40" fill="#e5484d"/><text x="41" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">0</text><text x="41" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁰</text><rect x="62" y="45" width="42" height="40" fill="#ef6b3a"/><text x="83" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">1</text><rect x="104" y="45" width="42" height="40" fill="#f59e0b"/><text x="125" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="125" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻²</text><rect x="146" y="45" width="42" height="40" fill="#eab308"/><text x="167" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">3</text><rect x="188" y="45" width="42" height="40" fill="#a3c414"/><text x="209" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="209" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻⁴</text><rect x="230" y="45" width="42" height="40" fill="#5cb85c"/><text x="251" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">5</text><rect x="272" y="45" width="42" height="40" fill="#22a06b"/><text x="293" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">6</text><text x="293" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻⁶</text><rect x="314" y="45" width="42" height="40" fill="#1fa187"/><text x="335" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">7</text><rect x="356" y="45" width="42" height="40" fill="#14a0b5"/><text x="377" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">8</text><text x="377" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻⁸</text><rect x="398" y="45" width="42" height="40" fill="#1a8fd8"/><text x="419" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">9</text><rect x="440" y="45" width="42" height="40" fill="#1d74d8"/><text x="461" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">10</text><text x="461" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻¹⁰</text><rect x="482" y="45" width="42" height="40" fill="#2b5fd0"/><text x="503" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">11</text><rect x="524" y="45" width="42" height="40" fill="#4b4fc4"/><text x="545" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">12</text><text x="545" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻¹²</text><rect x="566" y="45" width="42" height="40" fill="#5b3fb3"/><text x="587" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">13</text><rect x="608" y="45" width="42" height="40" fill="#5b2a9e"/><text x="629" y="71" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">14</text><text x="629" y="106" font-size="11.5" text-anchor="middle" fill="#0f1b2d">10⁻¹⁴</text><text x="20" y="128" font-size="13" fill="#5b6b80">[H⁺] in mol/L</text><text x="20" y="160" font-size="15" fill="#c0262d" font-weight="700">← more acidic (more H⁺)</text><text x="650" y="160" font-size="15" text-anchor="end" fill="#3b2a9e" font-weight="700">more alkaline →</text><text x="20" y="190" font-size="15" fill="#0f1b2d">pH 3 vs pH 5: 2 steps → 10² = <tspan font-weight="700" fill="#1456c0">100× more H⁺</tspan></text></svg>