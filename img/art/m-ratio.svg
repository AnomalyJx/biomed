<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 195" role="img" aria-label="Ratio bar sharing 50 mL in the ratio 2 to 3" font-family="Lexend,Segoe UI,Arial,sans-serif"><rect width="640" height="195" fill="#fff"/><text x="20" y="34" font-size="17" fill="#0f1b2d">Share 50 mL in the ratio <tspan font-weight="700">2 : 3</tspan>  →  5 parts, 10 mL per part</text><rect x="20" y="55" width="120" height="50" fill="#cfe0fb" stroke="#1456c0" stroke-width="1.5"/><text x="80" y="86" font-size="16" text-anchor="middle" fill="#0f1b2d">10 mL</text><rect x="140" y="55" width="120" height="50" fill="#cfe0fb" stroke="#1456c0" stroke-width="1.5"/><text x="200" y="86" font-size="16" text-anchor="middle" fill="#0f1b2d">10 mL</text><rect x="260" y="55" width="120" height="50" fill="#9ec2f7" stroke="#1456c0" stroke-width="1.5"/><text x="320" y="86" font-size="16" text-anchor="middle" fill="#0f1b2d">10 mL</text><rect x="380" y="55" width="120" height="50" fill="#9ec2f7" stroke="#1456c0" stroke-width="1.5"/><text x="440" y="86" font-size="16" text-anchor="middle" fill="#0f1b2d">10 mL</text><rect x="500" y="55" width="120" height="50" fill="#9ec2f7" stroke="#1456c0" stroke-width="1.5"/><text x="560" y="86" font-size="16" text-anchor="middle" fill="#0f1b2d">10 mL</text><path d="M22 120 h236" stroke="#1456c0" stroke-width="2"/><text x="140" y="145" font-size="17" text-anchor="middle" fill="#1456c0" font-weight="700">A = 20 mL (2/5 = 40%)</text><path d="M262 120 h356" stroke="#0a84ff" stroke-width="2"/><text x="440" y="145" font-size="17" text-anchor="middle" fill="#0a84ff" font-weight="700">B = 30 mL (3/5 = 60%)</text><text x="20" y="178" font-size="14" fill="#5b6b80">Part : part (2 : 3) is not part : whole (2/5).</text></svg>