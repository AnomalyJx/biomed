<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation Year Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm study companion, clear and encouraging, never cluttered.
   IDEA: a stained microscope slide — H&E stain: haematoxylin purple + eosin pink on clean glass.
   PICTURE: the working tool itself — topic chips, editable notes, slide figures, quiz cards.
   COLOUR & TYPE: purple dominant, eosin pink accent, glass white; Lexend throughout (made for reading).
   LAYOUT: sticky top bar with three views, single readable column up to 860px, figures in a snap carousel. */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaff,#16121d);--card:light-dark(#ffffff,#211b2b);--ink:light-dark(#1d1726,#efeaf6);--mute:light-dark(#625a70,#b3a9c2);
--line:light-dark(#e6e0ef,#352c42);--hx:light-dark(#4b2a7b,#b99af0);--hxbg:light-dark(#4b2a7b,#2b1f40);--eo:light-dark(#d6336c,#ff7aa8);
--eosoft:light-dark(#fdeaf1,#3a1f2c);--hxsoft:light-dark(#efe8fa,#2c2340);--ok:light-dark(#137a4b,#5fd39c);--oksoft:light-dark(#e3f6ec,#173626);--bad:light-dark(#c0262d,#ff8a8f);--badsoft:light-dark(#fdeaea,#3d1c1f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Lexend,system-ui,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--eo);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--hxbg);color:#fff}
.top{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px)}
.logo{width:34px;height:34px;flex:none}
h1{font-size:18px;line-height:1.2;margin:0;font-weight:700;flex:1}
h1 small{display:block;font-size:12px;font-weight:400;opacity:.8}
nav.tabs{max-width:900px;margin:auto;display:flex;gap:4px;padding:0 max(4vw,14px)}
nav.tabs a{flex:1;text-align:center;color:#fff;text-decoration:none;padding:10px 6px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;opacity:.8}
nav.tabs a[aria-current=page]{border-color:var(--eo);opacity:1}
main{max-width:900px;margin:auto;padding:16px max(4vw,14px) 80px}
.subj{display:flex;gap:6px;background:var(--hxsoft);padding:4px;border-radius:12px;margin:0 0 10px}
.subj button{flex:1;border:0;background:transparent;border-radius:9px;min-height:42px;font-weight:600;font-size:15px;color:var(--hx)}
.subj button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
figure.inl{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:12px;text-align:center}
figure.inl svg{width:100%;max-width:460px;height:auto}
figure.inl figcaption{font-size:13px;color:var(--mute)}
.grp{font-weight:700;color:var(--hx);margin:16px 0 0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-size:14px;scroll-snap-align:start}
.chip[aria-pressed=true]{background:var(--hx);border-color:var(--hx);color:var(--bg);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px);margin-bottom:16px}
h2{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:0 0 6px;text-wrap:balance;color:var(--hx)}
.meta{color:var(--mute);font-size:14px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}
.btn{border:1.5px solid var(--hx);background:transparent;color:var(--hx);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:600;font-size:14px}
.btn.solid{background:var(--hx);color:var(--bg)}
.btn.pink{background:var(--eo);border-color:var(--eo);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.saved{font-size:13px;color:var(--ok);margin-left:auto}
.notes{outline:none;border-radius:10px;transition:box-shadow .2s}
.notes.editing{box-shadow:0 0 0 2px var(--eo);padding:10px;background:var(--eosoft)}
.notes h3{font-size:19px;margin:22px 0 6px;color:var(--hx)}
.notes h3:first-child{margin-top:0}
.notes ul,.notes ol{padding-left:22px;margin:6px 0}
.notes li{margin:3px 0}
.notes b{color:light-dark(#2d1a4c,#fff)}
.notes code{background:var(--hxsoft);padding:1px 6px;border-radius:5px;font-size:14px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--hxsoft)}
.figs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.fig{flex:0 0 min(78%,420px);scroll-snap-align:start;margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig button{display:block;width:100%;padding:0;border:0;background:#fff}
.fig img{display:block;width:100%;height:200px;object-fit:contain}
.fig figcaption{font-size:13px;padding:8px 10px;color:var(--mute)}
.figwrap{position:relative}
.fignav{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);font-size:16px;resize:vertical}
label.lbl{font-weight:600;display:block;margin:0 0 6px}
.lightbox{position:fixed;inset:0;background:rgba(10,6,16,.92);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:82vh;background:#fff;border-radius:8px}
.lightbox p{color:#fff;margin:10px 0 0;text-align:center}
.lightbox .btn{position:absolute;top:12px;right:12px;color:#fff;border-color:#fff}
/* quiz */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px;margin:10px 0 14px}
.pick label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;background:var(--bg);font-size:14.5px}
.pick input{width:20px;height:20px;accent-color:var(--hx);flex:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.progress{height:8px;background:var(--hxsoft);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--eo);transition:width .3s}
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute)}
.qtext{font-size:clamp(18px,3.6vw,21px);font-weight:600;line-height:1.35;margin:8px 0 14px}
.qimg{background:#fff;border-radius:12px;border:1px solid var(--line);margin:0 0 14px;padding:6px;text-align:center}
.qimg img{max-width:100%;max-height:300px}
.qimg svg{width:100%;max-width:420px;height:auto;color:#1d1726}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:52px;font-size:16px;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hxsoft);color:var(--hx);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:not(:disabled):hover{border-color:var(--hx)}
.opt.right{border-color:var(--ok);background:var(--oksoft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:12px;background:var(--hxsoft)}
.fb strong{display:block;margin-bottom:4px}
.big{font-size:clamp(40px,10vw,64px);font-weight:700;color:var(--hx);line-height:1}
.rows{display:grid;gap:10px;margin-top:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14.5px}
.row .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--hxsoft);overflow:hidden}
.row .track i{display:block;height:100%;background:var(--hx)}
.row .track i.lo{background:var(--eo)}
.review{border-top:1px solid var(--line);padding:12px 0}
.review p{margin:4px 0}
.muted{color:var(--mute);font-size:14px}
.empty{color:var(--mute);text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){table{font-size:13px}th,td{padding:5px 6px}.fig img{height:170px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="12" width="36" height="16" rx="3" fill="#fff" opacity=".18"/><circle cx="20" cy="20" r="9" fill="#ff7aa8"/><circle cx="20" cy="20" r="4" fill="#4b2a7b"/><circle cx="12" cy="16" r="2.2" fill="#fff" opacity=".7"/></svg>
    <h1>Foundation Year Revision<small>Biology &amp; Maths for Science · notes &amp; quiz · LSBU</small></h1>
  </div>
  <nav class="tabs" aria-label="Views">
    <a href="#notes" id="tab-notes">Notes</a>
    <a href="#quiz" id="tab-quiz">Quiz</a>
    <a href="#progress" id="tab-progress">Progress</a>
  </nav>
</header>
<main id="app"></main>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Enlarged figure">
  <button class="btn" id="lbClose">Close</button>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>
<script src="data-notes.js"></script>
<script src="data-quiz.js"></script>
<script src="data-maths.js"></script>
<script>
{
const T = window.TOPICS, Q = window.QUESTIONS, S = window.SVGS;
Q.forEach((q,i) => q.id = i);
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  ver: 1,
  get(k, d){ try{ const v = localStorage.getItem("fob."+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("fob."+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem("fob."+k); }catch(e){} }
};
T.forEach(t => { if(!t.subject) t.subject = "bio"; });
const SUBJ = {bio:"Biology", maths:"Maths for Science"};
const topicById = id => T.find(t => t.id === id);
const ofSubj = s => T.filter(t => t.subject === s);
const countFor = id => Q.filter(q => q.t === id).length;
let current = store.get("topic", T[0].id);
if(!topicById(current)) current = T[0].id;

/* ---------- NOTES ---------- */
function wrapTables(html){ return html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>'); }
function renderNotes(){
  const t = topicById(current);
  const custom = store.get("notes."+t.id, null);
  const mine = store.get("mine."+t.id, "");
  app.innerHTML = `
  <div class="subj" role="group" aria-label="Subject">${Object.entries(SUBJ).map(([k,v])=>`<button data-subj="${k}" aria-pressed="${t.subject===k}">${v}</button>`).join("")}</div>
  <div class="chips" role="toolbar" aria-label="Topics">${ofSubj(t.subject).map(x=>`<button class="chip" data-topic="${x.id}" aria-pressed="${x.id===current}">${esc(x.short)}</button>`).join("")}</div>
  <article class="card">
    <h2>${esc(t.title)}</h2>
    <p class="meta">${t.week ? esc(t.week) + " · " : ""}${countFor(t.id)} quiz questions${custom ? " · showing your edited version" : ""}</p>
    <div class="bar">
      <button class="btn" id="editBtn">Edit notes</button>
      <button class="btn" id="resetBtn" ${custom ? "" : "disabled"}>Reset to original</button>
      <button class="btn pink" id="quizThis">Quiz this topic</button>
      <span class="saved" id="saved" aria-live="polite"></span>
    </div>
    <div class="notes" id="notes">${custom || wrapTables(t.notes)}</div>
  </article>
  ${t.figs.length ? `<section class="card" aria-label="Figures from your slides">
    <h3 style="margin:0 0 4px;color:var(--hx)">Figures from your slides</h3>
    <p class="muted" style="margin:0 0 10px">Tap a figure to enlarge it.</p>
    <div class="figs" id="figs">${t.figs.map(([f,c])=>`<figure class="fig"><button data-img="${f}" data-cap="${esc(c)}" aria-label="Enlarge: ${esc(c)}"><img src="img/${f}.jpg" alt="${esc(c)}" loading="lazy"></button><figcaption>${esc(c)}</figcaption></figure>`).join("")}</div>
    ${t.figs.length>1 ? `<div class="fignav"><button class="btn" id="fPrev" aria-label="Previous figure">‹ Prev</button><button class="btn" id="fNext" aria-label="Next figure">Next ›</button></div>` : ""}
  </section>` : ""}
  <section class="card">
    <label class="lbl" for="mine">My notes for this topic</label>
    <textarea id="mine" placeholder="Add your own notes, mnemonics, things the lecturer said…">${esc(mine)}</textarea>
    <p class="muted" id="mineSaved" aria-live="polite" style="margin:6px 0 0">Saved automatically in this browser.</p>
  </section>`;
  const chipOn = app.querySelector('.chip[aria-pressed=true]'), chipRow = app.querySelector('.chips'); if(chipOn) chipRow.scrollLeft = chipOn.offsetLeft - chipRow.offsetLeft - chipRow.clientWidth/2 + chipOn.offsetWidth/2;
  const notes = $("#notes"), editBtn = $("#editBtn"), saved = $("#saved");
  let timer;
  editBtn.onclick = () => {
    const on = notes.isContentEditable;
    notes.contentEditable = on ? "false" : "true";
    notes.classList.toggle("editing", !on);
    editBtn.textContent = on ? "Edit notes" : "Done editing";
    editBtn.classList.toggle("solid", !on);
    if(!on){ notes.focus(); saved.textContent = "Editing: changes save as you type"; }
    else { saveNotes(); }
  };
  function saveNotes(){
    const ok = store.set("notes."+t.id, notes.innerHTML);
    saved.textContent = ok ? "Saved ✓" : "Couldn't save in this browser";
    $("#resetBtn").disabled = false;
  }
  notes.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(saveNotes, 600); });
  $("#resetBtn").onclick = (e) => {
    const b = e.currentTarget;
    if(b.dataset.confirm !== "1"){ b.dataset.confirm = "1"; b.textContent = "Tap again to reset"; setTimeout(()=>{ b.dataset.confirm=""; b.textContent="Reset to original"; }, 3000); return; }
    store.del("notes."+t.id); renderNotes();
  };
  $("#quizThis").onclick = () => { startQuiz(Q.filter(q => q.t === t.id), "all"); location.hash = "quiz"; window.scrollTo({top:0}); };
  const mineEl = $("#mine"); let mt;
  mineEl.addEventListener("input", () => { clearTimeout(mt); mt = setTimeout(()=>{ $("#mineSaved").textContent = store.set("mine."+t.id, mineEl.value) ? "Saved ✓" : "Couldn't save in this browser"; }, 500); });
  const figs = $("#figs");
  if(figs){
    figs.addEventListener("click", e => { const b = e.target.closest("button[data-img]"); if(b) openLB(b.dataset.img, b.dataset.cap); });
    const step = dir => { const w = figs.querySelector(".fig").offsetWidth + 12; figs.scrollBy({left: dir*w, behavior:"smooth"}); };
    if($("#fPrev")){ $("#fPrev").onclick = () => step(-1); $("#fNext").onclick = () => step(1); }
  }
}
app.addEventListener("click", e => {
  const sb = e.target.closest("[data-subj]");
  if(sb){ const last = store.get("last."+sb.dataset.subj, null); current = (last && topicById(last)) ? last : ofSubj(sb.dataset.subj)[0].id; store.set("topic", current); renderNotes(); return; }
  const c = e.target.closest(".chip[data-topic]");
  if(c){ current = c.dataset.topic; store.set("topic", current); store.set("last."+topicById(current).subject, current); renderNotes(); window.scrollTo({top:0}); }
});
function openLB(f, cap){ $("#lbImg").src = "img/"+f+".jpg"; $("#lbImg").alt = cap; $("#lbCap").textContent = cap; $("#lb").classList.add("open"); $("#lbClose").focus(); }
function closeLB(){ $("#lb").classList.remove("open"); }
$("#lbClose").onclick = closeLB;
$("#lb").addEventListener("click", e => { if(e.target.id === "lb") closeLB(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeLB();
  if(location.hash === "#quiz" && quizState && !quizState.done){
    const n = "1234".indexOf(e.key); const opts = app.querySelectorAll(".opt");
    if(n > -1 && opts[n] && !opts[n].disabled) opts[n].click();
    if(e.key === "Enter" && $("#nextBtn")) $("#nextBtn").click();
  }
});

/* ---------- QUIZ ---------- */
let quizSetup = store.get("setup", {topics: T.map(t=>t.id), n: 15});
let quizState = null;
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function renderSetup(){
  const sel = new Set(quizSetup.topics);
  const avail = Q.filter(q => sel.has(q.t)).length;
  app.innerHTML = `<section class="card">
    <h2>Test yourself</h2>
    <p class="meta">${Q.length} questions across ${T.length} topics. Pick topics, choose how many, and go.</p>
    <div class="bar"><button class="btn" id="all">Select all</button><button class="btn" data-only="bio">Only biology</button><button class="btn" data-only="maths">Only maths</button><button class="btn" id="none">Clear</button></div>
    ${Object.entries(SUBJ).map(([k,v])=>`<p class="grp">${v}</p><div class="pick">${ofSubj(k).map(t=>`<label><input type="checkbox" value="${t.id}" ${sel.has(t.id)?"checked":""}> <span>${esc(t.short)} <span class="muted">(${countFor(t.id)})</span></span></label>`).join("")}</div>`).join("")}
    <p class="lbl" style="margin-top:6px">Number of questions</p>
    <div class="seg" role="group" aria-label="Number of questions">${[10,15,25,"all"].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${String(quizSetup.n)===String(n)}">${n==="all"?"All ("+avail+")":n}</button>`).join("")}</div>
    <div class="bar" style="margin-top:18px">
      <button class="btn pink" id="start" ${avail? "": "disabled"}>Start quiz</button>
      ${(store.get("wrong",[])).length ? `<button class="btn" id="retryWrong">Retry my mistakes (${store.get("wrong",[]).length})</button>` : ""}
    </div>
  </section>`;
  app.querySelectorAll(".pick input").forEach(i => i.onchange = () => { quizSetup.topics = [...app.querySelectorAll(".pick input:checked")].map(x=>x.value); store.set("setup", quizSetup); renderSetup(); });
  $("#all").onclick = () => { quizSetup.topics = T.map(t=>t.id); store.set("setup", quizSetup); renderSetup(); };
  app.querySelectorAll("[data-only]").forEach(b => b.onclick = () => { quizSetup.topics = ofSubj(b.dataset.only).map(t=>t.id); store.set("setup", quizSetup); renderSetup(); });
  $("#none").onclick = () => { quizSetup.topics = []; store.set("setup", quizSetup); renderSetup(); };
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { quizSetup.n = b.dataset.n === "all" ? "all" : +b.dataset.n; store.set("setup", quizSetup); renderSetup(); });
  $("#start").onclick = () => startQuiz(Q.filter(q => sel.has(q.t)), quizSetup.n);
  if($("#retryWrong")) $("#retryWrong").onclick = () => { const w = new Set(store.get("wrong",[])); startQuiz(Q.filter(q => w.has(q.id)), "all"); };
}
function startQuiz(pool, n){
  let qs = shuffle(pool); if(n !== "all") qs = qs.slice(0, n);
  quizState = {qs: qs.map(q => { const order = shuffle(q.o.map((_,i)=>i)); return {...q, order}; }), i:0, score:0, answers:[], done:false};
  renderQuestion();
}
function renderQuestion(){
  const s = quizState, q = s.qs[s.i], t = topicById(q.t);
  const media = q.img ? `<div class="qimg"><img src="img/${q.img}.jpg" alt="Diagram for this question"></div>` : q.svg ? `<div class="qimg">${S[q.svg]}</div>` : "";
  app.innerHTML = `<section class="card">
    <div class="qtop"><span>Question ${s.i+1} of ${s.qs.length}</span><span>${esc(t.short)} · Score ${s.score}</span></div>
    <div class="progress"><i style="width:${(s.i)/s.qs.length*100}%"></i></div>
    <p class="qtext">${esc(q.q)}</p>
    ${media}
    <div class="opts">${q.order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="bar" style="margin-top:14px"><button class="btn" id="quit">End quiz</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.oi));
  $("#quit").onclick = () => finish();
}
function answer(oi){
  const s = quizState, q = s.qs[s.i], right = oi === q.a;
  if(right) s.score++;
  s.answers.push({q, chose: oi, right});
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const v = +b.dataset.oi; if(v === q.a) b.classList.add("right"); else if(v === oi) b.classList.add("wrong"); });
  $("#fb").innerHTML = `<div class="fb" role="status"><strong style="color:${right?"var(--ok)":"var(--bad)"}">${right ? "Correct!" : "Not quite. Answer: " + esc(q.o[q.a])}</strong>${esc(q.e)}</div>
    <div class="bar" style="margin-top:12px"><button class="btn solid" id="nextBtn">${s.i+1 < s.qs.length ? "Next question" : "See results"}</button></div>`;
  $("#nextBtn").onclick = () => { s.i++; if(s.i < s.qs.length) { renderQuestion(); window.scrollTo({top:0}); } else finish(); };
  $("#nextBtn").focus({preventScroll:true});
}
function finish(){
  const s = quizState; s.done = true;
  const by = {};
  s.answers.forEach(a => { (by[a.q.t] ||= {r:0,n:0}); by[a.q.t].n++; if(a.right) by[a.q.t].r++; });
  if(!s.recorded){ s.recorded = true;
  const stats = store.get("stats", {});
  Object.entries(by).forEach(([id,v]) => { const st = stats[id] || {r:0,n:0,best:0,attempts:0}; st.r += v.r; st.n += v.n; st.attempts++; st.best = Math.max(st.best, Math.round(v.r/v.n*100)); stats[id] = st; });
  store.set("stats", stats);
  const wrong = new Set(store.get("wrong", []));
  s.answers.forEach(a => a.right ? wrong.delete(a.q.id) : wrong.add(a.q.id));
  store.set("wrong", [...wrong]);
  }
  const n = s.answers.length, pct = n ? Math.round(s.score/n*100) : 0;
  const misses = s.answers.filter(a => !a.right);
  app.innerHTML = `<section class="card">
    <p class="meta">Quiz complete</p>
    <div class="big">${s.score}/${n}</div>
    <p style="margin:6px 0 0">${n ? pct + "% · " + (pct>=80 ? "Excellent work, you know this well." : pct>=60 ? "Good. Review the misses below, then retry them." : "Keep going. Re-read the notes for the weak topics, then retry.") : "No questions answered."}</p>
    <div class="rows">${Object.entries(by).map(([id,v])=>{ const p=Math.round(v.r/v.n*100); return `<div class="row"><span>${esc(topicById(id).short)}</span><span>${v.r}/${v.n}</span><div class="track"><i class="${p<60?"lo":""}" style="width:${p}%"></i></div></div>`; }).join("")}</div>
    <div class="bar" style="margin-top:16px">
      ${misses.length ? `<button class="btn pink" id="again">Retry the ${misses.length} I got wrong</button>` : ""}
      <button class="btn solid" id="newQ">New quiz</button>
    </div>
  </section>
  ${misses.length ? `<section class="card"><h3 style="margin:0;color:var(--hx)">Review your mistakes</h3>${misses.map(a=>`<div class="review"><p><b>${esc(a.q.q)}</b></p><p style="color:var(--bad)">Your answer: ${esc(a.q.o[a.chose])}</p><p style="color:var(--ok)">Correct: ${esc(a.q.o[a.q.a])}</p><p class="muted">${esc(a.q.e)}</p></div>`).join("")}</section>` : ""}`;
  if($("#again")) $("#again").onclick = () => startQuiz(misses.map(a=>Q[a.q.id]), "all");
  $("#newQ").onclick = () => { quizState = null; renderSetup(); };
  window.scrollTo({top:0});
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const stats = store.get("stats", {});
  const any = Object.keys(stats).length;
  const tot = Object.values(stats).reduce((a,v)=>({r:a.r+v.r,n:a.n+v.n}),{r:0,n:0});
  app.innerHTML = `<section class="card">
    <h2>Your progress</h2>
    <p class="meta">Saved in this browser only.${any ? ` Overall accuracy: ${Math.round(tot.r/tot.n*100)}% from ${tot.n} answers.` : ""}</p>
    ${any ? Object.entries(SUBJ).map(([k,v])=>`<p class="grp">${v}</p><div class="rows">${ofSubj(k).map(t=>{ const st = stats[t.id]; if(!st) return `<div class="row"><span>${esc(t.short)}</span><span class="muted">not tried</span><div class="track"><i style="width:0"></i></div></div>`; const p=Math.round(st.r/st.n*100); return `<div class="row"><span>${esc(t.short)} <span class="muted">· best ${st.best}%</span></span><span>${p}%</span><div class="track"><i class="${p<60?"lo":""}" style="width:${p}%"></i></div></div>`; }).join("")}</div>`).join("") + `
    <p class="muted" style="margin-top:14px">Pink bars are below 60%. Those are the topics to revise first.</p>
    <div class="bar"><button class="btn" id="wipe">Reset progress</button></div>` : `<p class="empty">No quizzes yet. Take one from the Quiz tab and your scores will appear here.</p>`}
  </section>`;
  if($("#wipe")) $("#wipe").onclick = (e) => { const b=e.currentTarget; if(b.dataset.c!=="1"){ b.dataset.c="1"; b.textContent="Tap again to confirm"; return; } store.del("stats"); store.del("wrong"); renderProgress(); };
}

/* ---------- ROUTER ---------- */
function route(){
  const h = (location.hash || "#notes").slice(1);
  const view = ["notes","quiz","progress"].includes(h) ? h : "notes";
  ["notes","quiz","progress"].forEach(v => { const a = $("#tab-"+v); if(v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(view === "notes") renderNotes();
  else if(view === "quiz") (quizState && !quizState.done) ? renderQuestion() : (quizState && quizState.done ? finish() : renderSetup());
  else renderProgress();
}
window.addEventListener("hashchange", route);
route();
}
</script>
